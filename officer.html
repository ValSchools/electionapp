<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Polling Officer Terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#090d16; --card:rgba(19,26,42,0.75); --border:rgba(255,255,255,0.08);
      --text:#f3f4f6; --muted:#9ca3af; --accent:#8b5cf6; --emerald:#10b981; --rose:#f43f5e; --font:'Plus Jakarta Sans',system-ui,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);background-image:radial-gradient(at 0% 0%,rgba(139,92,246,0.15) 0,transparent 50%),radial-gradient(at 100% 100%,rgba(6,182,212,0.1) 0,transparent 50%);background-attachment:fixed;color:var(--text);font-family:var(--font);min-height:100vh;padding:env(safe-area-inset-top) 0 2rem;}
    .wrap{max-width:560px;margin:0 auto;padding:1.25rem;}
    .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;}
    .top h1{font-size:1.25rem;font-weight:800;}
    .who{font-size:.8rem;color:var(--muted);}
    .btn{cursor:pointer;border:none;border-radius:12px;padding:.95rem 1.1rem;font-family:inherit;font-weight:700;font-size:1rem;background:var(--accent);color:#fff;width:100%;transition:background .15s;}
    .btn:hover{background:#7c3aed;}
    .btn:disabled{opacity:.6;cursor:not-allowed;}
    .outline{background:transparent;border:1px solid var(--border);color:var(--text);}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1.25rem;backdrop-filter:blur(10px);margin-bottom:1rem;}
    .eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;}
    .input{width:100%;padding:.95rem 1rem;border-radius:12px;border:1px solid var(--border);background:rgba(9,13,22,0.6);color:var(--text);font-family:inherit;font-size:1.05rem;outline:none;margin-top:.5rem;}
    .input:focus{border-color:var(--accent);}
    .actions{display:flex;gap:.75rem;margin-top:1.25rem;}
    .hidden{display:none!important;}
    .step-num{display:inline-flex;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--accent);color:#fff;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;margin-right:.5rem;}
    .cand{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1rem;border:1px solid var(--border);border-radius:12px;margin-bottom:.6rem;cursor:pointer;font-size:1.02rem;font-weight:600;background:rgba(255,255,255,0.03);}
    .cand.sel{border-color:var(--accent);background:rgba(139,92,246,0.18);}
    .cand .dot{width:1.1rem;height:1.1rem;border-radius:50%;border:2px solid var(--border);}
    .cand.sel .dot{background:var(--accent);border-color:var(--accent);}
    .ticks{display:flex;gap:.4rem;margin:.75rem 0;}
    .tick{height:5px;flex:1;border-radius:99px;background:rgba(255,255,255,0.1);}
    .tick.on{background:var(--accent);}
    .empty{text-align:center;color:var(--muted);padding:3rem 1rem;}
    .spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,0.15);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;}
    @keyframes spin{to{transform:rotate(360deg);}}
    /* Toasts */
    #toastHost{position:fixed;top:1rem;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:.6rem;width:min(92vw,460px);pointer-events:none;}
    .toast{pointer-events:auto;display:flex;align-items:center;gap:.6rem;padding:.9rem 1.1rem;border-radius:12px;font-size:.95rem;font-weight:700;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);animation:tin .25s ease,tpulse 1.6s ease .25s 1;}
    .toast .ic{font-size:1.15rem;}
    .toast.success{background:linear-gradient(135deg,rgba(16,185,129,.95),rgba(5,150,105,.95));}
    .toast.error{background:linear-gradient(135deg,rgba(244,63,94,.95),rgba(190,40,60,.95));}
    .toast.info{background:linear-gradient(135deg,rgba(139,92,246,.95),rgba(124,58,237,.95));}
    @keyframes tin{from{opacity:0;transform:translateY(-12px) scale(.98);}to{opacity:1;transform:none;}}
    @keyframes tpulse{0%,100%{box-shadow:0 12px 30px rgba(0,0,0,.45);}50%{box-shadow:0 0 0 4px rgba(255,255,255,.12),0 12px 30px rgba(0,0,0,.45);}}
    .toast.hide{animation:tout .3s ease forwards;}
    @keyframes tout{to{opacity:0;transform:translateY(-12px) scale(.98);}}
  </style>
</head>
<body>
  <div id="toastHost"></div>
  <div class="wrap">
    <div class="top">
      <h1>🗳 Officer Terminal</h1>
      <div style="display:flex;gap:.5rem;align-items:center;">
        <span class="who" id="who"></span>
        <button class="btn outline" id="logout" style="width:auto;padding:.5rem .9rem;font-size:.8rem;" hidden>Sign out</button>
      </div>
    </div>
    <div id="app"></div>
  </div>

  <script>
    const CFG = {
      url: 'https://qxnnvrutncabawodyznl.supabase.co',
      key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4bm52cnV0bmNhYmF3b2R5em5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNTg0MjEsImV4cCI6MjEwMTczNDQyMX0.oLIy2heucbVnqaYrWBAKR7bjZSlZfm4Vgmr1CXY_NBg',
      functionUrl: 'https://qxnnvrutncabawodyznl.supabase.co/functions/v1/log-vote'
    };
    const S = { session:null, ballot:null, id:'', step:0, picks:{}, review:false };
    const $ = s => document.querySelector(s);
    const esc = s => String(s).replace(/[&<>"']/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));

    function toast(msg, type='info', ms=4000){
      const host = document.getElementById('toastHost'); if(!host) return;
      const icons={success:'✅',error:'⚠️',info:'ℹ️'};
      const el=document.createElement('div'); el.className='toast '+type;
      el.innerHTML=`<span class="ic">${icons[type]||icons.info}</span><span>${esc(msg)}</span>`;
      host.appendChild(el);
      setTimeout(()=>{el.classList.add('hide');setTimeout(()=>el.remove(),350);},ms);
    }
    async function req(path, body, auth=true, _retry=false){
      let headers={ apikey:CFG.key, Authorization:'Bearer '+((auth&&S.session)?S.session.token:CFG.key), 'Content-Type':'application/json', 'Prefer':'return=representation' };
      let method = body?'POST':'GET';
      let r = await fetch(CFG.url+path,{method,headers,body:body?JSON.stringify(body):undefined});
      let d = await r.json().catch(()=>null);
      if(!r.ok){ let m=d?.message||d?.error||('HTTP '+r.status); throw Error(m); }
      return d;
    }
    async function rpc(fn,args={}){ return req('/rest/v1/rpc/'+fn, args); }
    async function loadBallot(){ if(S.ballot) return; const data=await rpc('election_ballot'); S.ballot={positions:(data&&data.positions)||[]}; }

    function draw(){
      if(!S.session){ login(); return; }
      if(!S.ballot || !S.ballot.positions.length){ drawLoading('Loading ballot…'); loadBallot().then(()=>{ if(S.ballot.positions.length){ idEntry(); } else { drawEmpty(); } }).catch(e=>drawError(e)); return; }
      if(S.review) return review();
      if(S.id) return step();
      idEntry();
    }
    function drawLoading(t){ $('#app').innerHTML=`<div class="empty"><div class="spinner" style="margin-bottom:1rem;"></div>${esc(t)}</div>`; }
    function drawError(e){ $('#app').innerHTML=`<div class="empty"><h2>Could not load</h2><p>${esc(e.message)}</p><button class="btn" style="margin-top:1rem;" onclick="S.ballot=null;draw()">Retry</button></div>`; }
    function drawEmpty(){ $('#app').innerHTML=`<div class="empty"><h2>No active ballot</h2><p>The admin hasn't configured positions yet, or the election is not open.</p></div>`; }

    function login(){
      $('#app').innerHTML=`
        <div class="card">
          <h2 style="margin-bottom:.4rem;">Officer Sign In</h2>
          <p style="color:var(--muted);font-size:.88rem;margin-bottom:1rem;">Enter your polling officer credentials to unlock the terminal.</p>
          <form id="form">
            <label class="eyebrow">Email</label>
            <input class="input" id="email" type="email" autocomplete="email" required autofocus>
            <label class="eyebrow" style="margin-top:1rem;display:block;">Password</label>
            <input class="input" id="pass" type="password" autocomplete="current-password" required>
            ${S.error?`<div class="toast error" style="position:static;transform:none;margin-top:1rem;width:100%;">${esc(S.error)}</div>`:''}
            <button class="btn" id="loginBtn" style="margin-top:1.25rem;">Unlock Terminal</button>
          </form>
        </div>`;
      $('#form').onsubmit=async e=>{
        e.preventDefault();
        const b=$('#loginBtn'); b.disabled=true; b.innerHTML='<span class="spinner"></span> Signing in…';
        try{
          const a=await req('/auth/v1/token?grant_type=password',{email:$('#email').value.trim(),password:$('#pass').value},false);
          S.session={user:a.user.email, role:'operator', token:a.access_token, refresh:a.refresh_token};
          localStorage.yeOfficerSession=JSON.stringify(S.session);
          S.error=''; $('#who').textContent=a.user.email; $('#logout').hidden=false;
          toast('Welcome, officer','success');
          draw();
        }catch(e){
          const msg=e.message||'Sign-in failed.';
          S.error=/invalid login|invalid_grant|email not confirmed/i.test(msg)?'Sign-in failed. Check email & password, and confirm the account if needed.':msg;
          draw();
        }
      };
    }

    function idEntry(){
      $('#app').innerHTML=`
        <div class="card">
          <div class="eyebrow">Step 1 · Verify Voter</div>
          <h2 style="margin:.4rem 0 1rem;">Enter Voter ID Code</h2>
          <form id="idform">
            <input class="input" id="vid" placeholder="e.g. YTH-101" style="text-transform:uppercase;" autofocus>
            <button class="btn" id="verifyBtn" style="margin-top:1.25rem;">Verify & Open Ballot</button>
          </form>
        </div>`;
      $('#idform').onsubmit=async e=>{
        e.preventDefault();
        const id=$('#vid').value.trim().toUpperCase();
        const b=$('#verifyBtn'); b.disabled=true; b.innerHTML='<span class="spinner"></span> Verifying…';
        try{
          const r=await rpc('verify_voter',{p_voter:id});
          if(!r.ok) throw Error(r.reason);
          S.id=id; S.step=0; S.picks={}; S.ballot.positions.forEach(p=>S.picks[p.name]='Abstain'); S.review=false;
          toast('Voter verified','success');
          draw();
        }catch(e){ toast(e.message,'error'); b.disabled=false; b.innerHTML='Verify & Open Ballot'; }
      };
    }

    function step(){
      const p=S.ballot.positions[S.step], n=S.ballot.positions.length;
      $('#app').innerHTML=`
        <div class="eyebrow">Step ${S.step+1} of ${n} · ${esc(S.id)}</div>
        <div class="ticks">${Array.from({length:n},(_,i)=>`<i class="tick ${i<=S.step?'on':''}"></i>`).join('')}</div>
        <h1 style="margin:.4rem 0 1rem;">${esc(p.name)}</h1>
        <div id="opts">
          <div class="cand ${S.picks[p.name]==='Abstain'?'sel':''}" data-v="Abstain"><span>🚫 Abstain</span><span class="dot"></span></div>
          ${(p.candidates||[]).map(c=>`<div class="cand ${S.picks[p.name]===c.name?'sel':''}" data-v="${esc(c.name)}"><span>${esc(c.name)}</span><span class="dot"></span></div>`).join('')}
        </div>
        <div class="actions">
          <button class="btn outline" id="back" style="width:auto;">← Back</button>
          <button class="btn" id="next">${S.step===n-1?'Review →':'Next →'}</button>
        </div>`;
      $('#opts').querySelectorAll('.cand').forEach(el=>el.onclick=()=>{ S.picks[p.name]=el.dataset.v; step(); });
      $('#back').onclick=()=>{ if(S.step>0){S.step--;draw();} else {S.id='';draw();} };
      $('#next').onclick=()=>{ if(S.step<n-1){S.step++;step();} else {S.review=true;review();} };
    }

    function review(){
      const rows=S.ballot.positions.map(p=>`<div class="cand"><span>${esc(p.name)}</span><span style="color:var(--muted)">${esc(S.picks[p.name])}</span></div>`).join('');
      $('#app').innerHTML=`
        <div class="card">
          <div class="eyebrow">Review · ${esc(S.id)}</div>
          <h1 style="margin:.4rem 0 1rem;">Confirm Ballot</h1>
          <p style="color:var(--muted);font-size:.85rem;margin-bottom:1rem;">Once cast, the ballot cannot be changed.</p>
          <div style="display:flex;flex-direction:column;gap:.6rem;">${rows}</div>
          <div class="actions">
            <button class="btn outline" id="back" style="width:auto;">← Back</button>
            <button class="btn" id="cast">✓ Cast Official Ballot</button>
          </div>
        </div>`;
      $('#back').onclick=()=>{ S.review=false; S.step=S.ballot.positions.length-1; draw(); };
      $('#cast').onclick=async ()=>{
        const b=$('#cast'); b.disabled=true; b.innerHTML='<span class="spinner"></span> Casting…';
        try{
          const r=await rpc('cast_ballot',{p_voter:S.id,p_picks:S.picks});
          if(!r.ok) throw Error(r.reason);
          if(CFG.functionUrl){
            const allPositions=S.ballot.positions.map(p=>{const picked=S.picks[p.name];const isAb=!picked||picked==='Abstain';return {position:p.name,candidate:isAb?null:picked,isAbstain:isAb};});
            fetch(CFG.functionUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voterId:S.id,voterName:'',positions:allPositions,castAt:new Date().toISOString()})}).catch(()=>{});
          }
          toast('Ballot cast for '+S.id,'success');
          $('#app').innerHTML=`<div class="empty"><div style="font-size:3rem;margin-bottom:1rem;">✅</div><h2 style="color:var(--emerald);">Ballot Cast!</h2><p>Hand the device back to the officer.</p><button class="btn" style="margin-top:2rem;max-width:240px;" onclick="S.id='';S.step=0;S.picks={};S.review=false;draw();">Next Voter →</button></div>`;
        }catch(e){ toast(e.message,'error'); b.disabled=false; b.innerHTML='✓ Cast Official Ballot'; }
      };
    }

    function results(){
      $('#app').innerHTML=`<div class="empty"><div class="spinner" style="margin-bottom:1rem;"></div>Loading tallies…</div>`;
      rpc('election_results').then(d=>{
        const turn=d.registered?Math.round((d.ballots/d.registered)*100):0;
        let html=`<div class="card"><h2 style="margin-bottom:.5rem;">Live Tallies</h2>
          <p style="color:var(--muted);font-size:.85rem;">${d.ballots||0} ballots · ${d.registered||0} registered · ${turn}% turnout</p></div>`;
        (d.positions||[]).forEach(p=>{
          const total=(p.candidates||[]).reduce((s,c)=>s+(c.votes||0),0)||1;
          html+=`<div class="card"><h3 style="margin-bottom:.75rem;">${esc(p.name)}</h3>`;
          (p.candidates||[]).slice().sort((a,b)=>(b.votes||0)-(a.votes||0)).forEach(c=>{
            const pct=Math.round((c.votes||0)/total*100);
            html+=`<div style="margin-bottom:.7rem;"><div style="display:flex;justify-content:space-between;font-size:.9rem;font-weight:600;"><span>${esc(c.name)}</span><span>${c.votes||0} (${pct}%)</span></div><div style="height:8px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;margin-top:.3rem;"><div style="height:100%;width:${pct}%;background:var(--accent);"></div></div></div>`;
          });
          html+=`</div>`;
        });
        $('#app').innerHTML=html;
      }).catch(e=>drawError(e));
    }

    // Bottom tab bar (simplified operator nav)
    $('#app').insertAdjacentHTML('afterend','');
    const tabs=document.createElement('nav');
    tabs.style.cssText='position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(9,13,22,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border);z-index:50;';
    tabs.innerHTML=`<button class="t" data-v="vote" style="flex:1;padding:1rem;background:none;border:0;color:var(--text);font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer;">🗳 Ballot</button><button class="t" data-v="res" style="flex:1;padding:1rem;background:none;border:0;color:var(--text);font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer;">📊 Tallies</button>`;
    document.body.appendChild(tabs);
    tabs.querySelectorAll('.t').forEach(b=>b.onclick=()=>{ if(b.dataset.v==='res'){results();} else {S.review=false;if(S.id)step();else idEntry();} });

    $('#logout').onclick=()=>{ localStorage.removeItem('yeOfficerSession'); S.session=null; S.ballot=null; $('#who').textContent=''; $('#logout').hidden=true; draw(); };

    (async()=>{
      try{ const raw=localStorage.getItem('yeOfficerSession'); if(raw){ const s=JSON.parse(raw); if(s&&s.token){ S.session=s; $('#who').textContent=s.user; $('#logout').hidden=false; } } }catch{}
      draw();
    })();

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  </script>
</body>
</html>
