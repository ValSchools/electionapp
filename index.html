<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
  <title>Youth Election — Official Voting Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --bg-card: rgba(19, 26, 42, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.35);
      --accent-hover: #7c3aed;
      --cyan: #06b6d4;
      --emerald: #10b981;
      --rose: #f43f5e;
      --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      background-image:
        radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top {
      position: sticky; top: 0; z-index: 10;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.25rem;
    }
    .toprow {
      max-width: 600px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .mark {
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      color: #fff; font-weight: 800; border-radius: 10px;
      padding: 6px 10px; font-size: 0.85rem; box-shadow: 0 0 15px var(--accent-glow);
    }
    .brand { font-weight: 750; font-size: 1.05rem; }
    .sub { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
    .shell { max-width: 600px; margin: 0 auto; padding: 1.5rem 1.25rem 5rem; width: 100%; flex: 1; }
    .tabs { display: flex; gap: 12px; margin-top: 10px; max-width: 600px; margin-left: auto; margin-right: auto; }
    .tab {
      background: none; border: 0; color: var(--muted); padding: 6px 12px;
      font-weight: 700; font-family: var(--font); font-size: 0.88rem; border-radius: 8px; cursor: pointer;
    }
    .tab.active { color: #fff; background: rgba(139,92,246,0.15); border: 1px solid rgba(139,92,246,0.3); }
    h1 { font-size: clamp(1.7rem,5vw,2.2rem); line-height: 1.15; margin: 1.5rem 0 0.5rem; letter-spacing: -0.02em; font-weight: 800; }
    p { color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.25rem; }
    .field { margin-top: 1.25rem; }
    .eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; display: block; margin-bottom: 0.5rem; }
    .input {
      width: 100%; padding: 0.95rem 1rem; border: 1px solid var(--border); border-radius: 12px;
      background: rgba(15,22,36,0.8); color: #fff; font-family: var(--font); font-size: 1rem; transition: all 0.2s;
    }
    .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
    .big { text-align: center; font-size: 1.5rem; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; }
    .actions { display: flex; gap: 10px; margin-top: 1.75rem; }
    .btn, .outline {
      min-height: 52px; border-radius: 12px; padding: 0 18px; font-family: var(--font);
      font-weight: 750; font-size: 0.95rem; border: 0; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .btn { background: linear-gradient(135deg,var(--accent),var(--accent-hover)); color:#fff; flex:1; box-shadow: 0 4px 20px var(--accent-glow); }
    .btn:hover { opacity:.92; transform:translateY(-1px); }
    .btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }
    .outline { background: rgba(255,255,255,0.06); color:#fff; border:1px solid var(--border); }
    .outline:hover { background: rgba(255,255,255,0.12); }
    .opts { display: grid; gap: 10px; margin-top: 1.5rem; }
    .opt {
      display: flex; align-items: center; gap: 12px; border: 1px solid var(--border);
      border-radius: 14px; padding: 1rem; font-weight: 600; background: var(--bg-card);
      cursor: pointer; transition: all 0.2s;
    }
    .opt:hover { border-color: rgba(139,92,246,0.4); }
    .opt:has(input:checked) { background: rgba(139,92,246,0.15); border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
    .opt input { accent-color: var(--accent); width: 20px; height: 20px; }
    .ticks { display: flex; gap: 4px; margin: 1.5rem 0 0.5rem; }
    .tick { height: 6px; flex: 1; background: rgba(255,255,255,0.1); border-radius: 99px; }
    .tick.on { background: linear-gradient(90deg,var(--accent),var(--cyan)); }
    .review { border-top: 1px solid var(--border); margin-top: 1.5rem; }
    .row { display: flex; gap: 10px; align-items: center; padding: 0.9rem 0; border-bottom: 1px solid var(--border); }
    .row b { width: 38%; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .row span { flex: 1; font-weight: 650; }
    .row button { border:0; background:none; color:#c4b5fd; text-decoration:underline; font-weight:700; cursor:pointer; font-size:0.85rem; }
    .banner { margin-top: 1.25rem; padding: 0.85rem 1rem; border-radius: 10px; font-size: 0.85rem; }
    .error { background: rgba(244,63,94,0.15); border:1px solid rgba(244,63,94,0.3); color:#fca5a5; }
    .pos { border-top: 1px solid var(--border); padding: 1.5rem 0; }
    .pos h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; }
    .candline { display: flex; justify-content: space-between; font-size: 0.88rem; font-weight: 600; margin-bottom: 0.35rem; }
    .track { height: 8px; background: rgba(255,255,255,0.06); border-radius: 99px; overflow: hidden; margin-top: 0.4rem; }
    .fill { height: 100%; background: linear-gradient(90deg,var(--accent),var(--cyan)); border-radius: 99px; }
    .empty { text-align: center; padding: 4rem 1rem; color: var(--muted); line-height: 1.6; }
    .empty h2 { color: var(--text); margin-bottom: 0.5rem; }
    .install { display: none; } .install.show { display: inline-flex; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header class="top">
    <div class="toprow">
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="mark">YE</span>
        <div>
          <div class="brand" id="appTitle">Youth Election Terminal</div>
          <div class="sub" id="who">Polling Station</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="outline install" id="install" aria-label="Install app" style="padding:6px 12px;min-height:36px;font-size:0.8rem;">📲 Install</button>
        <button class="outline" id="logout" hidden style="padding:6px 12px;min-height:36px;font-size:0.8rem;">Sign out</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" hidden>
      <button class="tab active" id="voteTab">Ballot Terminal</button>
      <button class="tab" id="resultTab">Live Tallies</button>
    </nav>
  </header>

  <main class="shell" id="app">
    <div class="empty">
      <div class="spinner" style="margin:0 auto 1rem;display:block;width:32px;height:32px;border-width:3px;"></div>
      Initialising…
    </div>
  </main>

  <script>
    const CFG = {
      url: 'https://qxnnvrutncabawodyznl.supabase.co',
      key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4bm52cnV0bmNhYmF3b2R5em5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNTg0MjEsImV4cCI6MjEwMTczNDQyMX0.oLIy2heucbVnqaYrWBAKR7bjZSlZfm4Vgmr1CXY_NBg',
      functionUrl: 'https://qxnnvrutncabawodyznl.supabase.co/functions/v1/log-vote'
    };

    // ── Clear any stale session on load ─────────────────────
    function isJwtExpired(token) {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        return payload.exp * 1000 < Date.now();
      } catch { return true; }
    }
    const _raw = localStorage.getItem('yeSession');
    if (_raw) {
      try {
        const _sess = JSON.parse(_raw);
        if (!_sess.token || isJwtExpired(_sess.token)) {
          localStorage.removeItem('yeSession');
        }
      } catch { localStorage.removeItem('yeSession'); }
    }
    // ────────────────────────────────────────────────────────

    let S = {
      route: 'vote',
      session: JSON.parse(localStorage.yeSession || 'null'),
      ballot: null, results: null,
      id: '', step: 0, picks: {}, review: false, error: ''
    };

    const $ = s => document.querySelector(s);
    const esc = s => String(s).replace(/[&<>"']/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));

    async function tryRefreshToken() {
      if (!S.session?.refresh) return false;
      try {
        const r = await fetch(`${CFG.url}/auth/v1/token?grant_type=refresh_token`, {
          method: 'POST',
          headers: { apikey: CFG.key, 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: S.session.refresh })
        });
        if (!r.ok) return false;
        const d = await r.json();
        S.session.token    = d.access_token;
        S.session.refresh  = d.refresh_token;
        localStorage.yeSession = JSON.stringify(S.session);
        return true;
      } catch { return false; }
    }

    async function req(path, body, auth = true, _retry = false) {
      const r = await fetch(CFG.url + path, {
        method: body ? 'POST' : 'GET',
        headers: {
          apikey: CFG.key,
          Authorization: 'Bearer ' + (auth && S.session ? S.session.token : CFG.key),
          'Content-Type': 'application/json'
        },
        body: body ? JSON.stringify(body) : undefined
      });
      const d = await r.json().catch(() => null);
      if (!r.ok) {
        const msg = d?.message || d?.error || `HTTP ${r.status}`;
        if ((msg.includes('JWT') || r.status === 401) && auth && !_retry) {
          const ok = await tryRefreshToken();
          if (ok) return req(path, body, auth, true);
          // refresh failed → force sign-out
          localStorage.removeItem('yeSession');
          S.session = null; S.ballot = null;
          draw();
          throw Error('Session expired. Please sign in again.');
        }
        throw Error(msg);
      }
      return d;
    }

    const rpc = (fn, args = {}, pub = false) => req(`/rest/v1/rpc/${fn}`, args, !pub);

    function draw() {
      $('#logout').hidden = !S.session;
      $('#tabs').hidden   = !(S.session?.role === 'admin');
      $('#who').textContent = S.session ? `${S.session.user} · ${S.session.role}` : 'Polling Station';
      if (S.route === 'results') return results();
      if (!S.session) return login();
      ballot();
    }

    /* ── LOGIN ─────────────────────────────────────────── */
    function login() {
      $('#app').innerHTML = `
        <h1>Officer Sign In</h1>
        <p>Enter your polling officer credentials to unlock the ballot terminal.</p>
        <form id="form" class="field">
          <label class="eyebrow">Email</label>
          <input class="input" id="email" type="email" autocomplete="email" required autofocus>
          <label class="eyebrow" style="margin-top:1.1rem">Password</label>
          <input class="input" id="pass" type="password" autocomplete="current-password" required>
          ${S.error ? `<div class="banner error">${esc(S.error)}</div>` : ''}
          <div class="actions"><button class="btn" id="loginBtn">Unlock Terminal</button></div>
        </form>`;

      $('#form').onsubmit = async e => {
        e.preventDefault();
        const b = $('#loginBtn');
        b.disabled = true;
        b.innerHTML = '<span class="spinner"></span>Signing in…';
        try {
          const a = await req('/auth/v1/token?grant_type=password',
            { email: $('#email').value.trim(), password: $('#pass').value }, false);
          let role = 'operator';
          try { role = await rpc('my_role'); } catch (_) {}
          S.session = { user: a.user.email, role, token: a.access_token, refresh: a.refresh_token };
          localStorage.yeSession = JSON.stringify(S.session);
          S.error = '';
          draw();
        } catch (e) {
          const msg = e.message || 'Sign-in failed.';
          S.error = /invalid login|invalid_grant|email not confirmed/i.test(msg)
            ? 'Sign-in failed. Check the email and password, make sure the account exists in Supabase Authentication, and confirm the email if confirmation is enabled.'
            : msg;
          draw();
        }
      };
    }

    /* ── BALLOT ROUTER ──────────────────────────────────── */
    async function ballot() {
      if (!S.ballot) {
        $('#app').innerHTML = '<div class="empty"><div class="spinner" style="margin:0 auto 1rem;display:block;width:32px;height:32px;border-width:3px;"></div>Loading ballot…</div>';
        try { await loadBallot(); draw(); }
        catch (e) {
          $('#app').innerHTML = `<div class="empty"><h2>Could not load ballot</h2><p>${esc(e.message)}</p>
            <div class="actions" style="justify-content:center;margin-top:1.5rem;">
              <button class="outline" style="min-width:160px" onclick="S.ballot=null;draw()">Retry</button>
            </div></div>`;
        }
        return;
      }
      if (!S.id)    return idEntry();
      if (S.review) return review();
      step();
    }

    async function loadBallot() {
      if (S.ballot) return;
      const data = await rpc('election_ballot');
      S.ballot = { positions: (data && data.positions) || [] };
      if (!S.ballot.positions.length) {
        throw Error('No positions configured yet. Add positions in the admin dashboard (Contestants tab).');
      }
    }

    /* ── ID ENTRY ────────────────────────────────────────── */
    function idEntry() {
      $('#app').innerHTML = `
        <h1>Voter Check-In</h1>
        <p>Confirm identity on paper register, then enter Voter ID and hand device to voter.</p>
        <form id="idform" class="field">
          <label class="eyebrow">Voter ID</label>
          <input class="input big" id="vid" placeholder="YTH-001" required autofocus>
          <div class="actions"><button class="btn" id="verifyBtn">Verify & Open Ballot</button></div>
        </form>`;

      $('#idform').onsubmit = async e => {
        e.preventDefault();
        const id = $('#vid').value.trim().toUpperCase();
        const b  = $('#verifyBtn');
        b.disabled = true;
        b.innerHTML = '<span class="spinner"></span>Verifying…';
        try {
          const r = await rpc('verify_voter', { p_voter: id });
          if (!r.ok) throw Error(r.reason);
          S.id = id; S.step = 0; S.picks = {};
          S.ballot.positions.forEach(p => S.picks[p.name] = 'Abstain');
          draw();
        } catch (e) { alert(e.message); b.disabled = false; b.innerHTML = 'Verify & Open Ballot'; }
      };
    }

    /* ── STEP ────────────────────────────────────────────── */
    function step() {
      const p = S.ballot.positions[S.step], n = S.ballot.positions.length;
      $('#app').innerHTML = `
        <div class="eyebrow">Step ${S.step+1} of ${n} · ${esc(S.id)}</div>
        <div class="ticks">${Array.from({length:n},(_,i)=>`<i class="tick ${i<=S.step?'on':''}"></i>`).join('')}</div>
        <h1 style="margin-top:.5rem">${esc(p.name)}</h1>
        <p>Select one candidate or choose Abstain.</p>
        <div class="opts">
          ${(p.candidates||[]).map(c=>`<label class="opt">
            <input type="radio" name="c" value="${esc(c)}" ${S.picks[p.name]===c?'checked':''}><span>${esc(c)}</span>
          </label>`).join('')}
          <label class="opt">
            <input type="radio" name="c" value="Abstain" ${S.picks[p.name]==='Abstain'?'checked':''}>
            <span style="color:var(--muted)">Abstain (skip this position)</span>
          </label>
        </div>
        <div class="actions">
          ${S.step ? '<button class="outline" id="back">← Back</button>' : ''}
          <button class="btn" id="next">${S.step===n-1?'Review Ballot →':'Next →'}</button>
        </div>`;
      document.querySelectorAll('input[name=c]').forEach(x => x.onchange = () => S.picks[p.name] = x.value);
      if ($('#back')) $('#back').onclick = () => { S.step--; draw(); };
      $('#next').onclick = () => { S.step===n-1 ? S.review=true : S.step++; draw(); };
    }

    /* ── REVIEW ──────────────────────────────────────────── */
    function review() {
      const rows = S.ballot.positions.map((p,i)=>`
        <div class="row">
          <b>${esc(p.name)}</b>
          <span>${esc(S.picks[p.name])}</span>
          <button data-i="${i}">Change</button>
        </div>`).join('');
      $('#app').innerHTML = `
        <div class="eyebrow">Review · ${esc(S.id)}</div>
        <h1>Confirm Your Ballot</h1>
        <p>Once cast, ballots cannot be changed. Check every choice carefully.</p>
        <div class="review">${rows}</div>
        <div class="actions">
          <button class="outline" id="back">← Back</button>
          <button class="btn" id="cast">✓ Cast Official Ballot</button>
        </div>`;
      document.querySelectorAll('.row button').forEach(b => b.onclick = () => { S.step=+b.dataset.i; S.review=false; draw(); });
      $('#back').onclick = () => { S.review=false; S.step=S.ballot.positions.length-1; draw(); };
$('#cast').onclick = async () => {
        const b = $('#cast'); b.disabled=true;
        b.innerHTML = '<span class="spinner"></span>Casting ballot�?�';
        try {
          const r = await rpc('cast_ballot', { p_voter: S.id, p_picks: S.picks });
          if (!r.ok) throw Error(r.reason);
          if (CFG.functionUrl) {
            const allPositions = S.ballot.positions.map(p => {
              const picked = S.picks[p.name];
              const isAbstain = !picked || picked === 'Abstain';
              return { position: p.name, candidate: isAbstain ? null : picked, isAbstain };
            });
            fetch(CFG.functionUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ voterId: S.id, voterName: '', positions: allPositions, castAt: new Date().toISOString() })
            }).catch(() => {});
          }
          $('#app').innerHTML = `
            <div class="empty" style="padding-top:3rem;">
              <div style="font-size:3rem;margin-bottom:1rem;">✅</div>
              <h2 style="color:var(--emerald);margin-bottom:.5rem;">Ballot Cast!</h2>
              <p>Thank you. Please hand the device back to the polling officer.</p>
              <div class="actions" style="justify-content:center;margin-top:2rem;">
                <button class="btn" id="nextVoter" style="max-width:240px;">Next Voter →</button>
              </div>
            </div>`;
          $('#nextVoter').onclick = () => { S.id=''; S.step=0; S.picks={}; S.review=false; draw(); };
        } catch (e) { alert(e.message); b.disabled=false; b.innerHTML='✓ Cast Official Ballot'; }
      };
    }

    /* ── RESULTS ─────────────────────────────────────────── */
    async function results() {
      if (!S.results) {
        $('#app').innerHTML = '<div class="empty"><div class="spinner" style="margin:0 auto 1rem;display:block;width:32px;height:32px;border-width:3px;"></div>Loading results…</div>';
        try { S.results = await rpc('election_results', {}, true); }
        catch (e) { $('#app').innerHTML=`<div class="empty"><h2>Results unavailable</h2><p>${esc(e.message)}</p></div>`; return; }
      }
      let html = `<h1>Live Tallies</h1><p>${S.results.ballots||0} ballots cast out of ${S.results.registered||0} registered voters.</p>`;
      for (const p of (S.results.positions||[])) {
        const cs = [...(p.candidates||[])].sort((a,b)=>b.votes-a.votes);
        const total = cs.reduce((s,c)=>s+c.votes,0)||1;
        html += `<section class="pos"><h2>${esc(p.name)}</h2>`;
        cs.forEach(c => {
          const pct = Math.round(c.votes/total*100);
          html += `<div style="margin-top:.9rem;">
            <div class="candline"><strong>${esc(c.name)}</strong><span>${c.votes} votes · ${pct}%</span></div>
            <div class="track"><div class="fill" style="width:${Math.max(pct,2)}%"></div></div>
          </div>`;
        });
        html += `</section>`;
      }
      if (!(S.results.positions||[]).length) html += `<div class="empty"><p>No positions found. Add positions in Supabase.</p></div>`;
      $('#app').innerHTML = html + `<div class="actions" style="margin-top:2rem;">
        <button class="outline" id="refresh">🔄 Refresh</button></div>`;
      $('#refresh').onclick = () => { S.results=null; draw(); };
    }

    /* ── TABS + HEADER ───────────────────────────────────── */
    $('#voteTab').onclick   = () => { S.route='vote';    $('#voteTab').classList.add('active');   $('#resultTab').classList.remove('active'); draw(); };
    $('#resultTab').onclick = () => { S.route='results'; $('#resultTab').classList.add('active'); $('#voteTab').classList.remove('active');   draw(); };
    $('#logout').onclick    = () => { localStorage.removeItem('yeSession'); S.session=null; S.ballot=null; draw(); };

    /* ── PWA ─────────────────────────────────────────────── */
    let deferred = null;
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred=e; $('#install').classList.add('show'); });
    $('#install').onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred=null; $('#install').classList.remove('show'); };
    window.addEventListener('appinstalled', () => $('#install').classList.remove('show'));
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});

    // Load application settings (title) on startup
    async function loadSettings() {
      try {
        const settings = await rpc('election_settings', {}, true);
        const title = settings?.app_title || 'Youth Election Terminal';
        $('#appTitle').textContent = title;
        document.title = title + ' — Official Voting Terminal';
      } catch (_) {
        // The terminal remains usable with its default title if settings cannot load
      }
    }

    loadSettings();
    draw();
  </script>
</body>
</html>
